[package]
name = "smart-library-app"
version = "26.11.8"
description = "Smart Library desktop app (Tauri 2)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smart-library-core = { path = "../../core" }
tauri-plugin-dialog = "2"
ttf-parser = "0.25"
memmap2 = "0.9"
tauri-plugin-updater = "2"
reqwest = { version = "0.13", default-features = false, features = ["stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell"] }
