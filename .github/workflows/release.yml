name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            targets: ""
          - os: ubuntu-latest
            args: --bundles deb,rpm,appimage
            targets: ""
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg,app
            targets: x86_64-apple-darwin,aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci --legacy-peer-deps
      - name: Read release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version=$(node -p "require('./app/package.json').version")
          body=$(awk -v ver="$version" 'BEGIN { gsub(/\./, "[.]", ver) }
            $0 ~ "^## " ver "( |$)" { inside = 1; next }
            inside && /^## / { inside = 0 }
            inside { print }
          ' CHANGELOG.md | sed -E 's/^### +(.+)$/【\1】/; s/\*\*//g; s/`//g' | sed -e '/./,$!d' | awk 'NF { last = NR } { line[NR] = $0 } END { for (i = 1; i <= last; i++) print line[i] }')
          if [ -z "$body" ]; then
            body='请在发布前填写更新说明。'
          fi
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$body"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Configure signed updater
        shell: pwsh
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:UPDATER_PUBLIC_KEY -or -not $env:SIGNING_KEY) { throw 'Set TAURI_UPDATER_PUBLIC_KEY and TAURI_SIGNING_PRIVATE_KEY before releasing.' }
          node tools/configure-release.cjs
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: Smart Library v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true

